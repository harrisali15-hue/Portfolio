<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harris Ali – Projects</title>
<meta name="description" content="Projects by Harris Ali, junior web developer in Islamabad.">
<meta name="theme-color" content="#0c111b">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{--bg:#0c111b;--ink:#e8ecf5;--muted:#93a0b8;--line:#232c40;--accent:#6f8dff;--on-accent:#0c111b;--chip:#161e30;color-scheme:dark}
  :root[data-theme="light"]{--bg:#eef1f6;--ink:#14213d;--muted:#55627d;--line:#c9d1e0;--accent:#2b59ff;--on-accent:#fff;--chip:#dfe5f1;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "IBM Plex Sans",system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:max(56px,env(safe-area-inset-top)) 24px 96px}
  .bar{display:flex;justify-content:flex-end;margin-bottom:24px}
  #toggle{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;font:500 14px/1 "IBM Plex Sans",sans-serif;cursor:pointer}
  header{display:flex;align-items:center;gap:28px;margin-bottom:44px}
  .photo{width:124px;height:124px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);flex:none;background:var(--chip)}
  h1{font:800 clamp(2.4rem,8vw,4rem)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 12px}
  .intro{color:var(--muted);max-width:50ch;margin:0}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{display:flex;gap:20px;padding:28px 0;border-bottom:1px solid var(--line)}
  .icon{width:60px;height:60px;border-radius:22%;flex:none;display:none;border:1px solid var(--line)}
  li.has-icon .icon{display:block}
  .body{min-width:0;flex:1}
  h2{font:700 1.5rem/1.2 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
  p{margin:8px 0 14px;max-width:60ch}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .tag{font-size:13px;line-height:1;background:var(--chip);color:var(--muted);border-radius:999px;padding:7px 11px}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  .btn{font:500 15px/1 "IBM Plex Sans",sans-serif;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block}
  .primary{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
  .ghost{background:none;color:var(--ink);border:1px solid var(--line)}
  .btn:hover{filter:brightness(1.08)}
  .btn:focus-visible,#toggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){header{flex-direction:column;align-items:flex-start;gap:20px}li{gap:14px}.icon{width:48px;height:48px}}
</style>
</head>
<body>
<main>
  <div class="bar"><button id="toggle" type="button" aria-label="Switch between dark and light theme">Light mode</button></div>
  <header>
    <img class="photo" src="california.webp" alt="Photo of Harris Ali" onerror="this.style.visibility='hidden'">
    <div>
      <h1>Harris Ali</h1>
      <p class="intro">Junior web developer in Islamabad. Here’s what I’ve built.</p>
    </div>
  </header>
  <ul id="list"></ul>
</main>

<script>
/* ================================================================
   ▼ ADD NEW PROJECTS HERE, at the top of the list (newest first) ▼
   Copy the block from project-template.txt, paste it below, fill it in.
   ================================================================ */
const PROJECTS = [
  {
    // ← THIS IS THE PLACEHOLDER. Replace it with your first real project.
    title: "Your project name",
    description: "A short description of what this project does.",
    link: "https://YOUR-USERNAME.github.io/your-repo/",
    tags: ["HTML", "CSS", "JavaScript"]
  }
];

const list = document.getElementById("list");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "";

/* Finds a project's Apple touch icon: reads the page's own <link> tag, else tries the standard file name.
   If nothing loads, no icon is shown. */
async function findIcon(url){
  try{
    const r = await fetch(url);
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    const l = doc.querySelector('link[rel~="apple-touch-icon"], link[rel~="apple-touch-icon-precomposed"]');
    if (l && l.getAttribute("href")) return new URL(l.getAttribute("href"), r.url).href;
  }catch(e){}
  try{
    const base = /\/[^\/]*\.[a-z0-9]+$/i.test(url) || url.endsWith("/") ? url : url + "/";
    return new URL("apple-touch-icon.png", base).href;
  }catch(e){ return ""; }
}

function loadIcon(li, url){
  findIcon(url).then(src => {
    if (!src) return;
    const test = new Image();
    test.onload = () => { li.querySelector(".icon").src = src; li.classList.add("has-icon"); };
    test.src = src;
  });
}

async function copyLink(url, btn){
  try{ await navigator.clipboard.writeText(url); }
  catch(e){
    const t = document.createElement("textarea"); t.value = url; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch(_){} t.remove();
  }
  const old = btn.textContent; btn.textContent = "Copied";
  setTimeout(() => btn.textContent = old, 1500);
}

PROJECTS.forEach(p => {
  const url = safeUrl(p.link);
  const li = document.createElement("li");
  li.innerHTML = `
    <img class="icon" alt="" width="60" height="60">
    <div class="body">
      <h2>${esc(p.title)}</h2>
      <p>${esc(p.description)}</p>
      <div class="tags">${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${url ? `<div class="btns"><button type="button" class="btn ghost" data-copy>Copy link</button><a class="btn primary" href="${esc(url)}">Open link</a></div>` : ""}
    </div>`;
  list.appendChild(li);
  if (url){
    li.querySelector("[data-copy]").onclick = e => copyLink(url, e.currentTarget);
    loadIcon(li, url);
  }
});

const toggle = document.getElementById("toggle");
const themeMeta = document.querySelector('meta[name="theme-color"]');
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  toggle.textContent = t === "dark" ? "Light mode" : "Dark mode";
  themeMeta.content = t === "dark" ? "#0c111b" : "#eef1f6";
  try{ localStorage.setItem("theme", t); }catch(e){}
}
toggle.onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
applyTheme(document.documentElement.dataset.theme);
</script>
</body>
</html>
